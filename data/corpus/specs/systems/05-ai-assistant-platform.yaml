ownership_notes:
  - |
    Applied AI owns the platform's applications and the Ollama workstation; Platform Engineering
    operates the AI cluster. Because the platform is a pilot, SecOps reviews it quarterly and any
    expansion beyond the pilot user group requires a new assessment.
