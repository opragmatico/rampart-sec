operations:
  - |
    Backups: Langflow flows and n8n workflows are exported nightly to a GitLab repository by an n8n
    workflow; the Langflow and n8n databases are backed up nightly to the object store; Qdrant is
    rebuilt from Confluence by the synchronisation workflow and is not backed up; model weights are
    re-downloadable. No restore has been exercised yet (pilot).
  - |
    Change management: the Applied AI team deploys flow and workflow changes directly during the
    pilot and records them on the team's change page; component upgrades go through the weekly CAB.
    The pilot's exit criteria include moving flow changes to the GitLab deployment pipeline.
