operations:
  - |
    Backups: GitLab takes a nightly backup (repositories, database, uploads) to the object store with
    30-day retention; Gitaly storage is snapshotted every six hours. Artifactory's filestore is
    replicated to the secondary node and backed up weekly; the configuration is exported nightly.
    Harbor's database and storage are backed up nightly. Restores of GitLab and Artifactory were
    exercised on 2026-04-28 (recovery time six hours).
  - |
    Change management: component upgrades are scheduled through the weekly CAB and executed outside
    business hours in Europe. GitLab follows the vendor's monthly release within three weeks;
    Artifactory and Harbor are upgraded quarterly; Jenkins LTS quarterly. Emergency security upgrades
    use the emergency change procedure and are announced to engineering on the status channel.
