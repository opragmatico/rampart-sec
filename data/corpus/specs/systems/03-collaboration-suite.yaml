operations:
  - |
    Backups: the three PostgreSQL instances take nightly dumps to the object store with 35-day
    retention; the NAS volume holding attachments and files is snapshotted hourly and replicated to
    the secondary data centre nightly. Confluence and Jira home directories are backed up with the
    database. A restore of Confluence was exercised on 2026-03-19 (recovery time five hours).
  - |
    Change management: application upgrades are scheduled through the weekly CAB in the Saturday
    maintenance window because the Atlassian nodes are single instances. Emergency upgrades follow
    the emergency change procedure and are announced on the status channel. Nextcloud and its apps
    are updated monthly from the app store after a test on the staging instance.
