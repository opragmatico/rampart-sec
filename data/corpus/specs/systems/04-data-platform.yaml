operations:
  - |
    Backups: the warehouse uses streaming replication and nightly base backups with WAL archiving
    to the object store (recovery point 15 minutes); Elasticsearch takes nightly snapshots to the
    object store; Kafka topics are retained for seven days and all pipelines are replayable from the
    source systems. The Metabase and Airflow application databases are included in the nightly
    warehouse backup. A restore was exercised on 2026-05-02.
  - |
    Change management: component upgrades are scheduled through the weekly CAB; Metabase and the
    Airflow providers are upgraded monthly, Elasticsearch and Kibana quarterly, Kafka twice a year.
    Pipeline code changes go through merge requests and the GitLab deployment pipeline.
