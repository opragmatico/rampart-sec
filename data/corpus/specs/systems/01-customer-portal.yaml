operations:
  - |
    Backups: PostgreSQL uses streaming replication to portal-db-02 and a nightly base backup with
    continuous WAL archiving to the object store in the secondary data centre; the recovery point
    objective is 15 minutes and the recovery time objective four hours, last exercised on 2026-04-22.
    Redis data is not backed up (sessions are re-created on login). NetScaler and NGINX configurations
    are exported nightly to the configuration repository.
  - |
    Change management: routine changes go through the weekly CAB; emergency security changes use the
    emergency change procedure with retrospective CAB review. Application releases are deployed by
    the Owner Team's pipeline on the CI/CD platform, with a canary on booking-api-01 for one hour
    before the remaining hosts. Firmware upgrades on the ADC pair are performed on the standby node
    first with a failover test.
