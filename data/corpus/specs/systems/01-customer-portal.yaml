  - {hostname: portal-web-02.dmz.corp.example, ip: 203.0.113.22, zone: DMZ, role: NGINX Plus reverse proxy, os: Ubuntu 24.04 LTS}
  - {hostname: booking-api-01.corp.example, ip: 198.51.100.31, zone: Internal, role: Tomcat application server, os: RHEL 9.5}
  - {hostname: booking-api-02.corp.example, ip: 198.51.100.32, zone: Internal, role: Tomcat application server, os: RHEL 9.5}
  - {hostname: booking-api-03.corp.example, ip: 198.51.100.33, zone: Internal, role: Tomcat application server, os: RHEL 9.5}
  - {hostname: sso-01.corp.example, ip: 198.51.100.41, zone: Internal, role: Keycloak identity provider, os: RHEL 9.5}
  - {hostname: sso-02.corp.example, ip: 198.51.100.42, zone: Internal, role: Keycloak identity provider, os: RHEL 9.5}
