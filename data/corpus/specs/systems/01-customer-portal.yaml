id: customer-portal
name: Customer Portal and Booking API
title: System Risk Assessment — Customer Portal and Booking API
doc_id: SRA-2026-01
version: "2.3"
assessment_date: 2026-06-05
next_review: 2026-12-05
assessor: Security Operations (SecOps), with Digital Channels Engineering
owner_team: Digital Channels Engineering
exposure: internet-facing
data_classification: Restricted
purpose: |
  This assessment records the architecture, software inventory, exposure and controls of the
  Customer Portal and Booking API as deployed on the assessment date, so that SecOps can correlate
  newly disclosed vulnerabilities with what the system actually runs, and so that the Owner Team
  has an agreed baseline for change. It covers the production environment in the Rotterdam data
  centre and the DMZ in front of it. The staging environment shares the design but is reachable
  only from the engineering network and is covered by its own change record.
overview:
  - |
    The Customer Portal is the public web application through which Larkspur's customers create
    bookings, track shipments, download documents and manage their accounts. The Booking API behind
    it is the same capability for partner integrations (freight forwarders and customer ERP systems)
    using OAuth2 client credentials. About 18,000 customer users and 140 partner integrations use
    the system; it handles roughly 2.1 million requests per day with peaks at the start of each
    working day in Europe and East Asia.
  - |
    The system processes personal data of customer contacts (names, business e-mail addresses,
    phone numbers), commercial data (rates, volumes, consignee details) and payment references.
    Card data is never stored: payments are tokenised by the external payment provider and only the
    provider's token and the last four digits are retained. Under the data classification standard
    the system is rated Restricted because of the volume of customer personal data and the commercial
    sensitivity of booking and rate information. Availability tier is Tier 1 (24x7, four-hour
    recovery objective).
  - |
    Authentication for customers and partners is delegated to the company's Keycloak identity
    provider (OpenID Connect for the portal, OAuth2 client credentials for the API). Administrative
    access to every host is through the management bastion with multi-factor authentication.
architecture:
  - |
    Inbound traffic terminates on a pair of Citrix NetScaler ADC appliances in the DMZ, which provide
    TLS termination, the web application firewall policy, rate limiting and load balancing. Behind the
    ADCs, two NGINX Plus hosts serve the portal's static assets and reverse-proxy API traffic to the
    Booking API. The Booking API is a Spring MVC application packaged as a WAR and deployed on Apache
    Tomcat across three application hosts on the internal segment. State lives in a PostgreSQL
    primary with a streaming replica, and Redis holds sessions and short-lived rate-limit counters.
  - |
    Certificates for the internal hops are issued by the company CA. The application hosts run a
    certificate enrolment agent that renews host certificates over the Certificate Management
    Protocol (CMP) against the CA, using a locally built OpenSSL 3.5 toolchain because the
    distribution's OpenSSL lacks the CMP client features the agent needs.
hosts:
  - {hostname: edge-adc-01.dmz.corp.example, ip: 203.0.113.10, zone: DMZ, role: NetScaler ADC (active), os: NetScaler 14.1}
